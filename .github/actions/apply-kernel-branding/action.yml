name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-08)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        # Parse patch level to extract month number (e.g., 2024-08 -> 8)
        PATCH_MONTH=$(echo "${{ inputs.os_patch_level }}" | cut -d'-' -f2 | sed 's/^0*//')
        
        # Get git commit short hash (12 chars like stock format)
        GIT_COMMIT=$(git rev-parse --short=12 HEAD 2>/dev/null || echo "unknown")
        
        # Generate build ID (ab + YYMMDDHHMM format)
        BUILD_ID="ab$(date -u +%y%m%d%H%M 2>/dev/null || echo '00000000')"
        
        # Build number based on patch month (e.g., 8-00001)
        BUILD_NUM="${PATCH_MONTH}-00001"
        
        # Construct stock-like version string
        # Format: 5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902
        KERNEL_STRING="${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${BUILD_NUM}-g${GIT_COMMIT}-${BUILD_ID}"
        
        # Replace the last line of setlocalversion to output our string
        sed -i '$d' scripts/setlocalversion
        echo "echo \"$KERNEL_STRING\"" >> scripts/setlocalversion
        chmod +x scripts/setlocalversion
        
        echo "Kernel version string set to: $KERNEL_STRING"
